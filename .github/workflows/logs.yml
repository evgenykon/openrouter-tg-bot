name: Bot logs

on:
  workflow_dispatch:
    inputs:
      lines:
        description: 'Сколько последних строк логировать'
        required: false
        default: '300'

jobs:
  fetch:
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Fetch logs
        run: |
          PORT="${{ vars.DEPLOY_PORT || '22' }}"
          TARGET="${{ vars.DEPLOY_TARGET || '/app/openrouter-tg-bot' }}"
          ssh -p "${PORT}" -o StrictHostKeyChecking=no \
            "${{ vars.DEPLOY_USER || 'deployer' }}@${{ vars.DEPLOY_HOST }}" \
            "cd '${TARGET}' && docker compose ps && docker compose logs --timestamps --tail=${{ inputs.lines }} bot"