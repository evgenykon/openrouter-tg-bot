name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Sync source to server (rsync)
        run: |
          PORT="${{ vars.DEPLOY_PORT || '22' }}"
          TARGET="${{ vars.DEPLOY_TARGET || '/app/openrouter-tg-bot' }}"
          rsync -az --delete \
            --exclude node_modules \
            --exclude data \
            --exclude .env \
            --exclude config.json \
            --exclude .git \
            --exclude .DS_Store \
            -e "ssh -p ${PORT} -o StrictHostKeyChecking=no" \
            ./ "${{ vars.DEPLOY_USER || 'deployer' }}@${{ vars.DEPLOY_HOST }}:${TARGET}/"
          # config.json, .env, data/ исключены из синка и защищены от --delete

      - name: Rebuild and restart
        env:
          # Опциональные настройки модели: пустая переменная = значение из config.json
          MODEL: ${{ vars.MODEL }}
          COMPRESS_MODEL: ${{ vars.COMPRESS_MODEL }}
          MAX_TOKENS: ${{ vars.MAX_TOKENS }}
          REASONING_MAX_TOKENS: ${{ vars.REASONING_MAX_TOKENS }}
          MAX_CONTEXT_MESSAGES: ${{ vars.MAX_CONTEXT_MESSAGES }}
          FALLBACK_CONTEXT_TOKENS: ${{ vars.FALLBACK_CONTEXT_TOKENS }}
          SAFETY_MARGIN_PERCENT: ${{ vars.SAFETY_MARGIN_PERCENT }}
          CONTEXT_MESSAGE_MAX_CHARS: ${{ vars.CONTEXT_MESSAGE_MAX_CHARS }}
          CONTEXT_MAX_CHARS: ${{ vars.CONTEXT_MAX_CHARS }}
          COMPRESS_ENABLED: ${{ vars.COMPRESS_ENABLED }}
          OWNER_ID: ${{ vars.OWNER_ID }}
        run: |
          PORT="${{ vars.DEPLOY_PORT || '22' }}"
          TARGET="${{ vars.DEPLOY_TARGET || '/app/openrouter-tg-bot' }}"
          OVERRIDES=""
          for name in MODEL COMPRESS_MODEL MAX_TOKENS REASONING_MAX_TOKENS \
            MAX_CONTEXT_MESSAGES FALLBACK_CONTEXT_TOKENS SAFETY_MARGIN_PERCENT \
            CONTEXT_MESSAGE_MAX_CHARS CONTEXT_MAX_CHARS COMPRESS_ENABLED OWNER_ID; do
            if [ -n "${!name}" ]; then
              OVERRIDES="$OVERRIDES $name=$(printf '%q' "${!name}")"
            fi
          done
          ssh -p "${PORT}" -o StrictHostKeyChecking=no \
            "${{ vars.DEPLOY_USER || 'deployer' }}@${{ vars.DEPLOY_HOST }}" \
            "cd '${TARGET}' &&${OVERRIDES} docker compose up -d --build"
