services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ./data/redis:/data
    restart: unless-stopped

  bot:
    build: .
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379
      - CONFIG_PATH=/app/config.json
    volumes:
      - ./config.json:/app/config.json:ro
    depends_on:
      - redis
    restart: unless-stopped
